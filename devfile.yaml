schemaVersion: 2.2.0

metadata:
  name: dqc-devspace

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest

      memoryRequest: 2Gi
      memoryLimit: 6Gi

      cpuRequest: "100m"
      cpuLimit: "500m"

      mountSources: true

      env:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=4096"
